<!DOCTYPE html>
<html>
<body>
    <video id="video" controls autoplay width="100%"></video>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
    <script>
        const url = 'http://re.ycn-redirect.com/live/33523510/index.m3u8?t=S3tiJV9tBgMvRZbUYxqErw&e=1782865409';
        const video = document.getElementById('video');
        
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        }
    </script>
</body>
</html>
