  color:white;
  direction:rtl;
  text-align:center;

}

/* Welcome overlay */
#overlay{
  position:fixed;
  width:100%;
  height:100vh;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:fadeOut 1s ease forwards;
  animation-delay:2s;
}

#overlay h1{
  color:#00ff88;
  font-size:28px;
  animation:pop 1s infinite;
}

@keyframes pop{
  0%{transform:scale(1)}
  50%{transform:scale(1.1)}
  100%{transform:scale(1)}
}

@keyframes fadeOut{
  to{opacity:0; visibility:hidden;}
}

header{
  padding:20px;
  font-size:32px;
  font-weight:bold;
  color:#00ff88;
  background:#000;
  box-shadow:0 0 15px rgba(0,255,136,0.2);
}

.hero{
  padding:15px;
}

.hero img{
  width:95%;
  max-height:260px;
  object-fit:cover;
  border-radius:15px;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.card{
  background:#1b1b1b;
  margin:15px;
  padding:18px;
  border-radius:14px;
  box-shadow:0 0 12px rgba(0,255,136,0.15);
  transition:0.3s;
}

.card:hover{
  transform:scale(1.03);
}

h2{color:#00ff88;}

.btn{
  display:inline-block;
  padding:12px 18px;
  background:#25D366;
  color:white;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}

.btn:hover{
  background:#1ebe5d;
  transform:scale(1.05);
}

.float{
  position:fixed;
  bottom:15px;
  left:15px;
  background:#25D366;
  color:white;
  padding:12px 15px;
  border-radius:50px;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 0 15px rgba(0,0,0,0.4);
}

footer{
  margin-top:20px;
  padding:15px;
  background:#000;
  color:#aaa;
}
